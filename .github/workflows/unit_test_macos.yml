# ==============================================================================
# GitHub Actions Workflow: MacOS Unit Testing (x64 & ARM64)
# ==============================================================================
#
# This workflow performs continuous integration testing for RadarSimPy on
# both MacOS x64 and ARM64 (Apple Silicon) platforms. It builds and tests the
# radar simulation library across multiple Python versions to ensure compatibility
# and reliability.
#
# Triggers:
#   - Push to master branch
#   - Pull requests targeting master branch
#
# Test Matrix:
#   - Defined once, as JSON, in the `setup` job's "Define build matrix" step.
#     The `build` job consumes it via job outputs, so adding/removing a macOS
#     architecture or Python version only requires editing that one step.
#   - Python versions: 3.10, 3.11, 3.12, 3.13, 3.14
#   - Platform: MacOS 26 (x64), MacOS 26 (ARM64)
#   - Compilers: Clang/Clang++
#   - Architecture: x64, arm64 (CPU-only builds)
#   - `cpp-tests` marks the one entry per architecture (Python 3.13) that
#     builds and runs the C++ (Google Test) suite. It does not depend on the
#     Python version, so building it in every entry only cost time. The other
#     entries run pytest alone.
#
# Key Features:
#   - Pip package caching for faster builds
#   - Clang/Xcode environment setup
#   - System information display for debugging
#   - Timeout protection (60 minutes)
#   - Fail-fast disabled to test all Python versions
#
# Requirements:
#   - RADARSIMC SSH key secret for submodule access
#   - Xcode 26.4.1, Clang, and Python dependencies
#   - build.sh script
#
# ==============================================================================

name: MacOS Unit Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # Single source of truth for the test matrix. The build job reads this
  # instead of hardcoding macOS architectures/Python versions.
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Define test matrix
        id: set-matrix
        run: |
          cat > matrix.json << 'EOF'
          [
            { "arch": "x64", "runner": "macos-26-intel", "c_compiler": "clang", "cxx_compiler": "clang++", "xcode": "26.4.1", "os_label": "macosx64", "python-version": "3.10", "cpp-tests": false },
            { "arch": "x64", "runner": "macos-26-intel", "c_compiler": "clang", "cxx_compiler": "clang++", "xcode": "26.4.1", "os_label": "macosx64", "python-version": "3.11", "cpp-tests": false },
            { "arch": "x64", "runner": "macos-26-intel", "c_compiler": "clang", "cxx_compiler": "clang++", "xcode": "26.4.1", "os_label": "macosx64", "python-version": "3.12", "cpp-tests": false },
            { "arch": "x64", "runner": "macos-26-intel", "c_compiler": "clang", "cxx_compiler": "clang++", "xcode": "26.4.1", "os_label": "macosx64", "python-version": "3.13", "cpp-tests": true },
            { "arch": "x64", "runner": "macos-26-intel", "c_compiler": "clang", "cxx_compiler": "clang++", "xcode": "26.4.1", "os_label": "macosx64", "python-version": "3.14", "cpp-tests": false },
            { "arch": "arm64", "runner": "macos-26", "c_compiler": "clang", "cxx_compiler": "clang++", "xcode": "26.4.1", "os_label": "macosarm64", "python-version": "3.10", "cpp-tests": false },
            { "arch": "arm64", "runner": "macos-26", "c_compiler": "clang", "cxx_compiler": "clang++", "xcode": "26.4.1", "os_label": "macosarm64", "python-version": "3.11", "cpp-tests": false },
            { "arch": "arm64", "runner": "macos-26", "c_compiler": "clang", "cxx_compiler": "clang++", "xcode": "26.4.1", "os_label": "macosarm64", "python-version": "3.12", "cpp-tests": false },
            { "arch": "arm64", "runner": "macos-26", "c_compiler": "clang", "cxx_compiler": "clang++", "xcode": "26.4.1", "os_label": "macosarm64", "python-version": "3.13", "cpp-tests": true },
            { "arch": "arm64", "runner": "macos-26", "c_compiler": "clang", "cxx_compiler": "clang++", "xcode": "26.4.1", "os_label": "macosarm64", "python-version": "3.14", "cpp-tests": false }
          ]
          EOF
          echo "matrix=$(jq -c . matrix.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    timeout-minutes: 60
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ssh-key: ${{secrets.RADARSIMC}}
          submodules: recursive

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/pip
          # Wheels are per Python version and CPU architecture, so both are part
          # of the key; without the version only one job's wheels were saved.
          key: ${{ runner.os }}-${{ matrix.arch }}-py${{ matrix.python-version }}-pip-${{ hashFiles('requirements.txt', 'requirements-test.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-py${{ matrix.python-version }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Build and test dependencies only. requirements-dev.txt adds the lint
          # and docs tools, which are never used here.
          pip install -r requirements-test.txt

      - name: Setup license file
        run: |
          mkdir -p ./radarsimpy
          echo "$TEST_LICENSE_MACOS" > ./radarsimpy/license_RadarSimPy_MacOS.lic
        env:
          TEST_LICENSE_MACOS: ${{ secrets.TEST_LICENSE_MACOS }}

      - name: Display system information
        run: |
          echo "Python version:"
          python --version
          echo "Pip version:"
          pip --version
          echo "CMake version:"
          cmake --version
          echo "Xcode version:"
          xcodebuild -version
          echo "C Compiler version:"
          ${{ matrix.c_compiler }} --version
          echo "C++ Compiler version:"
          ${{ matrix.cxx_compiler }} --version
          echo "Architecture:"
          uname -m

      # The C++ test binary does not depend on the Python version, so only the
      # `cpp-tests` entry of each runner builds and runs it (build.sh
      # --test=on runs pytest too); the others build the module alone and run
      # pytest in the next step.
      - name: Build & Test
        env:
          CC: ${{ matrix.c_compiler }}
          CXX: ${{ matrix.cxx_compiler }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          chmod +x build.sh
          ./build.sh --license=on --arch=cpu --test=${{ matrix.cpp-tests && 'on' || 'off' }} --deps=release

      - name: Python tests
        if: ${{ !matrix.cpp-tests }}
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest

      - name: Display build logs on failure
        if: failure()
        run: |
          # ctest captures the full C++ test output here. The console copy can be
          # cut short, so this is the reliable record of a crashed test binary.
          if [ -f "src/radarsimcpp/build/Testing/Temporary/LastTest.log" ]; then
            echo "=== C++ Test Log (ctest) ==="
            tail -n 200 "src/radarsimcpp/build/Testing/Temporary/LastTest.log"
          fi
          if [ -f "src/radarsimcpp/build/CMakeFiles/CMakeOutput.log" ]; then
            echo "=== CMake Output Log ==="
            tail -n 100 "src/radarsimcpp/build/CMakeFiles/CMakeOutput.log"
          fi
          if [ -f "src/radarsimcpp/build/CMakeFiles/CMakeError.log" ]; then
            echo "=== CMake Error Log ==="
            tail -n 100 "src/radarsimcpp/build/CMakeFiles/CMakeError.log"
          fi

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-python-${{ matrix.python-version }}-${{ matrix.arch }}
          path: build_logs/
          retention-days: 1
          if-no-files-found: warn
