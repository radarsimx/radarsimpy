# ==============================================================================
# GitHub Actions Workflow: Windows x64 Unit Testing
# ==============================================================================
#
# This workflow performs continuous integration testing for RadarSimPy on
# Windows x64 platforms. It builds and tests the radar simulation library
# across multiple Python versions to ensure compatibility and reliability.
#
# Triggers:
#   - Push to master branch
#   - Pull requests targeting master branch
#
# Test Matrix:
#   - Defined once, as JSON, in the `setup` job's "Define test matrix" step.
#     The `build` job consumes it via job outputs, so adding/removing an entry
#     only requires editing that one step.
#   - GPU (CUDA) builds: Python 3.10, 3.11, 3.12, 3.13, 3.14. The CPU-only
#     build is no longer shipped for Windows: the CUDA build runs on the CPU
#     (OpenMP) when no usable GPU is present, so it is the one tested here.
#     macOS still covers the CPU-only build configuration.
#   - Platform: windows-2025 runner, x64
#   - RADARSIMX_CUDA_ARCHITECTURES is pinned to 75 to keep compile time down.
#   - `cpp-tests` marks the one entry that builds and runs the C++ (Google
#     Test) suite. It does not depend on the Python version, so building it in
#     every entry only cost time. The other entries run pytest alone.
#
# About the GPU entries:
#   GitHub-hosted runners have no CUDA device, so no GPU code path runs here.
#   What every entry covers is the shipped configuration as most users run it:
#   a CUDA-enabled build that falls back to CPU execution at runtime.
#   `gpu_available()` reports no device, `sim_radar`/`sim_rcs`/`sim_lidar`
#   dispatch to the CPU policy, and the C++ GPU-policy tests skip instead of
#   failing.
#
# Key Features:
#   - Pip package caching for faster builds
#   - CUDA toolkit installation, restored from the Actions cache after the
#     first run (.github/actions/setup-cuda-windows)
#   - System information display for debugging
#   - Build and C++ test log capture on failure
#   - Timeout protection (60 minutes)
#   - Fail-fast disabled so every entry reports independently
#
# Requirements:
#   - RADARSIMC SSH key secret for submodule access
#   - CMake, Visual Studio Build Tools, and Python dependencies
#   - build.bat script for Windows-specific building
#
# ==============================================================================

name: Windows Unit Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # Single source of truth for the test matrix. The build job reads this
  # instead of hardcoding Python versions and architectures.
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Define test matrix
        id: set-matrix
        run: |
          cat > matrix.json << 'EOF'
          [
            { "python-version": "3.10", "arch": "gpu", "cpp-tests": false },
            { "python-version": "3.11", "arch": "gpu", "cpp-tests": false },
            { "python-version": "3.12", "arch": "gpu", "cpp-tests": false },
            { "python-version": "3.13", "arch": "gpu", "cpp-tests": true },
            { "python-version": "3.14", "arch": "gpu", "cpp-tests": false }
          ]
          EOF
          echo "matrix=$(jq -c . matrix.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    name: ${{ matrix.arch }} / Python ${{ matrix.python-version }}
    runs-on: windows-2025
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ssh-key: ${{secrets.RADARSIMC}}
          submodules: recursive

      - name: Set up Python ${{matrix.python-version}}
        uses: actions/setup-python@v7
        with:
          python-version: ${{matrix.python-version}}

      - name: Cache pip packages
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\pip\Cache
          # Wheels are per Python version, so the version is part of the key;
          # without it the first job to finish saved only its own wheels.
          key: ${{ runner.os }}-py${{ matrix.python-version }}-pip-${{ hashFiles('requirements.txt', 'requirements-test.txt') }}
          restore-keys: |
            ${{ runner.os }}-py${{ matrix.python-version }}-pip-

      # Restores the installed toolkit from the Actions cache when it can; see
      # .github/actions/setup-cuda-windows for why.
      - name: Setup CUDA Toolkit
        if: matrix.arch == 'gpu'
        uses: ./.github/actions/setup-cuda-windows
        with:
          cuda: "13.4.3"
          sub-packages: '["nvcc", "crt", "nvvm", "cudart", "curand_dev", "thrust", "visual_studio_integration"]'

      - name: Verify CUDA installation
        if: matrix.arch == 'gpu'
        run: |
          echo "::group::CUDA Verification"
          nvcc --version
          echo "CUDA_PATH: %CUDA_PATH%"
          echo "PATH: %PATH%"
          if exist "%CUDA_PATH%\bin\" (
            dir "%CUDA_PATH%\bin\" | findstr nvcc
          ) else (
            echo "CUDA bin directory not found"
          )
          if exist "%CUDA_PATH%\lib\x64\" (
            echo "CUDA lib directory found"
          ) else (
            echo "CUDA lib directory not found"
          )
          echo "::endgroup::"
        shell: cmd

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Build and test dependencies only. requirements-dev.txt adds the lint
          # and docs tools, which took ~40 s to install and are never used here.
          pip install -r requirements-test.txt

      - name: Setup license file
        run: |
          New-Item -ItemType Directory -Force -Path .\radarsimpy
          $env:TEST_LICENSE_WINDOWS | Out-File -FilePath .\radarsimpy\license_RadarSimPy_Windows.lic -Encoding utf8
        env:
          TEST_LICENSE_WINDOWS: ${{ secrets.TEST_LICENSE_WINDOWS }}

      - name: Display system information
        run: |
          echo "Python version:"
          python --version
          echo "Pip version:"
          pip --version
          echo "CMake version:"
          cmake --version

      # The C++ test binary does not depend on the Python version, and building
      # it was ~5.5 min of every job while its tests ran in under a second. So
      # only the `cpp-tests` entry builds and runs it (build.bat --test=on runs
      # pytest too); the others build the module alone and run pytest below.
      - name: Build & Test
        run: |
          .\build.bat --license=on --arch=${{ matrix.arch }} --test=${{ matrix.cpp-tests && 'on' || 'off' }} --deps=release
        env:
          PYTHONPATH: ${{ github.workspace }}
          # Runners have no GPU, so one architecture is enough to compile and
          # link the CUDA build; the release workflows build the full set.
          RADARSIMX_CUDA_ARCHITECTURES: "75"

      - name: Python tests
        if: ${{ !matrix.cpp-tests }}
        run: |
          pytest
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Display build logs on failure
        if: failure()
        run: |
          # ctest captures the full C++ test output here. The console copy can be
          # cut short, so this is the reliable record of a crashed test binary.
          if (Test-Path "src/radarsimcpp/build/Testing/Temporary/LastTest.log") {
            echo "=== C++ Test Log (ctest) ==="
            Get-Content "src/radarsimcpp/build/Testing/Temporary/LastTest.log" -Tail 200
          }
          if (Test-Path "src/radarsimcpp/build/CMakeFiles/CMakeOutput.log") {
            echo "=== CMake Output Log ==="
            Get-Content "src/radarsimcpp/build/CMakeFiles/CMakeOutput.log" -Tail 100
          }
          if (Test-Path "src/radarsimcpp/build/CMakeFiles/CMakeError.log") {
            echo "=== CMake Error Log ==="
            Get-Content "src/radarsimcpp/build/CMakeFiles/CMakeError.log" -Tail 100
          }
