# ==============================================================================
# GitHub Actions Workflow: Ubuntu Unit Testing (x64 & ARM64; 22.04, 24.04 & 26.04)
# ==============================================================================
#
# This workflow performs continuous integration testing for RadarSimPy on
# Ubuntu 22.04, 24.04, and 26.04, on both x64 and ARM64. It builds and tests the
# radar simulation library across multiple Python versions to ensure
# compatibility and reliability.
#
# Triggers:
#   - Push to master branch
#   - Pull requests targeting master branch
#
# Test Matrix:
#   - Defined once, as JSON, in the `setup` job's "Define test matrix" step.
#     The `build` job consumes it via job outputs, so adding/removing an entry
#     only requires editing that one step.
#   - CPU builds: Python 3.10, 3.11, 3.12, 3.13, 3.14 on each Ubuntu version,
#     for both x64 and ARM64
#   - GPU build: Ubuntu 24.04 x64 / Python 3.13 only
#   - Platform: Ubuntu 22.04, Ubuntu 24.04, Ubuntu 26.04 (x64 and ARM64 runners)
#   - Compilers: GCC-11 (22.04), GCC-13 (24.04), GCC-15 (26.04)
#   - `arch` is the build architecture (cpu/gpu) passed to build.sh. The CPU
#     architecture comes from the runner: `ubuntu-XX.04` is x64 and
#     `ubuntu-XX.04-arm` is ARM64.
#
# About the ARM64 entries:
#   radarsimx-deps does not publish HDF5/mbedTLS for linux_aarch64 yet, neither
#   in its committed libs/ tree nor in its release archives, so `--deps=release`
#   has nothing to download on ARM64. Until it does, the `deps-arm64` job builds
#   them from the pinned deps submodule and the ARM64 entries link that build.
#   It runs once, on Ubuntu 22.04 with GCC-11, the same baseline the published
#   linux_x86_64 archives are built on, and is cached on the deps sources, so it
#   only rebuilds when the deps submodule moves. Once the deps release carries
#   linux_aarch64 and radarsimcpp's cmake/deps_manifest.cmake pins its
#   checksums, delete that job, the download step and the ARM64 branch of the
#   "Build & Test" step.
#
# About the GPU entry:
#   GitHub-hosted runners have no CUDA device, so this entry does not exercise
#   any GPU code path. What it covers is that a CUDA-enabled build compiles and
#   then falls back to CPU execution at runtime: `gpu_available()` reports no
#   device, `sim_radar`/`sim_rcs`/`sim_lidar` dispatch to the CPU policy, and
#   the C++ GPU-policy tests skip instead of failing. That behavior does not
#   vary by Python version or Ubuntu release, which the CPU entries already
#   cover, so one entry is enough. Add more entries below if that changes.
#
# Key Features:
#   - Pip package caching for faster builds
#   - GCC environment setup for C++ compilation
#   - CUDA toolkit installation for the GPU entry only
#   - HDF5/mbedTLS built from source for the ARM64 entries only
#   - System information display for debugging
#   - Build and C++ test log capture on failure
#   - Timeout protection (90 minutes, sized for the slower CUDA build)
#   - Fail-fast disabled so every entry reports independently
#
# Requirements:
#   - RADARSIMC SSH key secret for submodule access
#   - CMake, GCC, and Python dependencies
#   - CUDA toolkit (GPU entry only)
#   - build.sh script
#
# ==============================================================================

name: Ubuntu Unit Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # Single source of truth for the test matrix. The build job reads this
  # instead of hardcoding Ubuntu versions/Python versions/architectures.
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Define test matrix
        id: set-matrix
        run: |
          cat > matrix.json << 'EOF'
          [
            { "runner": "ubuntu-22.04", "c_compiler": "gcc-11", "cxx_compiler": "g++-11", "os_label": "ubuntu22", "python-version": "3.10", "arch": "cpu" },
            { "runner": "ubuntu-22.04", "c_compiler": "gcc-11", "cxx_compiler": "g++-11", "os_label": "ubuntu22", "python-version": "3.11", "arch": "cpu" },
            { "runner": "ubuntu-22.04", "c_compiler": "gcc-11", "cxx_compiler": "g++-11", "os_label": "ubuntu22", "python-version": "3.12", "arch": "cpu" },
            { "runner": "ubuntu-22.04", "c_compiler": "gcc-11", "cxx_compiler": "g++-11", "os_label": "ubuntu22", "python-version": "3.13", "arch": "cpu" },
            { "runner": "ubuntu-22.04", "c_compiler": "gcc-11", "cxx_compiler": "g++-11", "os_label": "ubuntu22", "python-version": "3.14", "arch": "cpu" },
            { "runner": "ubuntu-24.04", "c_compiler": "gcc-13", "cxx_compiler": "g++-13", "os_label": "ubuntu24", "python-version": "3.10", "arch": "cpu" },
            { "runner": "ubuntu-24.04", "c_compiler": "gcc-13", "cxx_compiler": "g++-13", "os_label": "ubuntu24", "python-version": "3.11", "arch": "cpu" },
            { "runner": "ubuntu-24.04", "c_compiler": "gcc-13", "cxx_compiler": "g++-13", "os_label": "ubuntu24", "python-version": "3.12", "arch": "cpu" },
            { "runner": "ubuntu-24.04", "c_compiler": "gcc-13", "cxx_compiler": "g++-13", "os_label": "ubuntu24", "python-version": "3.13", "arch": "cpu" },
            { "runner": "ubuntu-24.04", "c_compiler": "gcc-13", "cxx_compiler": "g++-13", "os_label": "ubuntu24", "python-version": "3.14", "arch": "cpu" },
            { "runner": "ubuntu-26.04", "c_compiler": "gcc-15", "cxx_compiler": "g++-15", "os_label": "ubuntu26", "python-version": "3.10", "arch": "cpu" },
            { "runner": "ubuntu-26.04", "c_compiler": "gcc-15", "cxx_compiler": "g++-15", "os_label": "ubuntu26", "python-version": "3.11", "arch": "cpu" },
            { "runner": "ubuntu-26.04", "c_compiler": "gcc-15", "cxx_compiler": "g++-15", "os_label": "ubuntu26", "python-version": "3.12", "arch": "cpu" },
            { "runner": "ubuntu-26.04", "c_compiler": "gcc-15", "cxx_compiler": "g++-15", "os_label": "ubuntu26", "python-version": "3.13", "arch": "cpu" },
            { "runner": "ubuntu-26.04", "c_compiler": "gcc-15", "cxx_compiler": "g++-15", "os_label": "ubuntu26", "python-version": "3.14", "arch": "cpu" },
            { "runner": "ubuntu-22.04-arm", "c_compiler": "gcc-11", "cxx_compiler": "g++-11", "os_label": "ubuntu22-arm64", "python-version": "3.10", "arch": "cpu" },
            { "runner": "ubuntu-22.04-arm", "c_compiler": "gcc-11", "cxx_compiler": "g++-11", "os_label": "ubuntu22-arm64", "python-version": "3.11", "arch": "cpu" },
            { "runner": "ubuntu-22.04-arm", "c_compiler": "gcc-11", "cxx_compiler": "g++-11", "os_label": "ubuntu22-arm64", "python-version": "3.12", "arch": "cpu" },
            { "runner": "ubuntu-22.04-arm", "c_compiler": "gcc-11", "cxx_compiler": "g++-11", "os_label": "ubuntu22-arm64", "python-version": "3.13", "arch": "cpu" },
            { "runner": "ubuntu-22.04-arm", "c_compiler": "gcc-11", "cxx_compiler": "g++-11", "os_label": "ubuntu22-arm64", "python-version": "3.14", "arch": "cpu" },
            { "runner": "ubuntu-24.04-arm", "c_compiler": "gcc-13", "cxx_compiler": "g++-13", "os_label": "ubuntu24-arm64", "python-version": "3.10", "arch": "cpu" },
            { "runner": "ubuntu-24.04-arm", "c_compiler": "gcc-13", "cxx_compiler": "g++-13", "os_label": "ubuntu24-arm64", "python-version": "3.11", "arch": "cpu" },
            { "runner": "ubuntu-24.04-arm", "c_compiler": "gcc-13", "cxx_compiler": "g++-13", "os_label": "ubuntu24-arm64", "python-version": "3.12", "arch": "cpu" },
            { "runner": "ubuntu-24.04-arm", "c_compiler": "gcc-13", "cxx_compiler": "g++-13", "os_label": "ubuntu24-arm64", "python-version": "3.13", "arch": "cpu" },
            { "runner": "ubuntu-24.04-arm", "c_compiler": "gcc-13", "cxx_compiler": "g++-13", "os_label": "ubuntu24-arm64", "python-version": "3.14", "arch": "cpu" },
            { "runner": "ubuntu-26.04-arm", "c_compiler": "gcc-15", "cxx_compiler": "g++-15", "os_label": "ubuntu26-arm64", "python-version": "3.10", "arch": "cpu" },
            { "runner": "ubuntu-26.04-arm", "c_compiler": "gcc-15", "cxx_compiler": "g++-15", "os_label": "ubuntu26-arm64", "python-version": "3.11", "arch": "cpu" },
            { "runner": "ubuntu-26.04-arm", "c_compiler": "gcc-15", "cxx_compiler": "g++-15", "os_label": "ubuntu26-arm64", "python-version": "3.12", "arch": "cpu" },
            { "runner": "ubuntu-26.04-arm", "c_compiler": "gcc-15", "cxx_compiler": "g++-15", "os_label": "ubuntu26-arm64", "python-version": "3.13", "arch": "cpu" },
            { "runner": "ubuntu-26.04-arm", "c_compiler": "gcc-15", "cxx_compiler": "g++-15", "os_label": "ubuntu26-arm64", "python-version": "3.14", "arch": "cpu" },
            { "runner": "ubuntu-24.04", "c_compiler": "gcc-13", "cxx_compiler": "g++-13", "os_label": "ubuntu24", "python-version": "3.13", "arch": "gpu" }
          ]
          EOF
          echo "matrix=$(jq -c . matrix.json)" >> "$GITHUB_OUTPUT"

  # Stand-in for the linux_aarch64 archives radarsimx-deps does not publish yet.
  # See "About the ARM64 entries" at the top of this file.
  deps-arm64:
    name: Prebuilt dependencies / linux_aarch64
    timeout-minutes: 60
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ssh-key: ${{secrets.RADARSIMC}}
          submodules: recursive

      - name: Cache staged dependencies
        id: deps-cache
        uses: actions/cache@v6
        with:
          path: src/radarsimcpp/deps/output
          key: deps-linux_aarch64-${{ hashFiles('src/radarsimcpp/deps/CMakeLists.txt', 'src/radarsimcpp/deps/build.sh', 'src/radarsimcpp/deps/cmake/**', 'src/radarsimcpp/deps/recipes/**') }}

      - name: Build dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        working-directory: src/radarsimcpp/deps
        env:
          CC: gcc-11
          CXX: g++-11
        run: ./build.sh

      - name: Verify staged output
        working-directory: src/radarsimcpp/deps
        run: bash verify.sh linux_aarch64

      - name: Upload staged dependencies
        uses: actions/upload-artifact@v7
        with:
          name: deps-linux-aarch64
          path: src/radarsimcpp/deps/output
          retention-days: 1
          if-no-files-found: error

  build:
    needs: [setup, deps-arm64]
    # Without this a failed deps-arm64 would skip every entry. Run them anyway:
    # the x64 entries do not use it, and the ARM64 ones then fail at the
    # download step, which points at the real cause.
    if: ${{ !cancelled() && needs.setup.result == 'success' }}
    name: ${{ matrix.os_label }} / ${{ matrix.arch }} / Python ${{ matrix.python-version }}
    # Sized for the GPU entry: nvcc compiles the whole library from scratch,
    # which does not fit in the 60 minutes the CPU entries need.
    timeout-minutes: 90
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ssh-key: ${{secrets.RADARSIMC}}
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-${{ runner.arch }}-pip-${{ hashFiles('**/requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pip-

      - name: Setup CUDA Toolkit
        if: matrix.arch == 'gpu'
        uses: radarsimx/cuda-toolkit@master
        with:
          cuda: "13.3.1"
          method: "network"
          sub-packages: '["nvcc"]'
          linux-local-args: '["--toolkit", "--silent"]'

      - name: Install CUDA cuRAND development headers
        if: matrix.arch == 'gpu'
        run: |
          sudo apt-get install -y libcurand-dev-13-3

      - name: Verify CUDA installation
        if: matrix.arch == 'gpu'
        run: |
          echo "::group::CUDA Verification"
          nvcc --version
          echo "CUDA_PATH: $CUDA_PATH"
          echo "LD_LIBRARY_PATH: $LD_LIBRARY_PATH"
          ls -la /usr/local/cuda/bin/ || echo "CUDA bin directory not found"
          ls -la /usr/local/cuda/lib64/ || echo "CUDA lib64 directory not found"
          echo "::endgroup::"

      - name: Download prebuilt dependencies (ARM64)
        if: runner.arch == 'ARM64'
        uses: actions/download-artifact@v8
        with:
          name: deps-linux-aarch64
          path: src/radarsimcpp/deps/output

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Setup license file
        run: |
          mkdir -p ./radarsimpy
          echo "$TEST_LICENSE_LINUX" > ./radarsimpy/license_RadarSimPy_Linux.lic
        env:
          TEST_LICENSE_LINUX: ${{ secrets.TEST_LICENSE_LINUX }}

      - name: Display system information
        run: |
          echo "Python version:"
          python --version
          echo "Pip version:"
          pip --version
          echo "CMake version:"
          cmake --version
          echo "GCC version:"
          ${{ matrix.c_compiler }} --version
          echo "G++ version:"
          ${{ matrix.cxx_compiler }} --version
          echo "Architecture:"
          uname -m

      - name: Build & Test
        env:
          CC: ${{ matrix.c_compiler }}
          CXX: ${{ matrix.cxx_compiler }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          sudo chown -R $USER:$USER /home/runner/work/radarsimpy
          chmod +x build.sh
          # An explicit RADARSIMCPP_<DEP>_ROOT wins over --deps=release, which
          # has no linux_aarch64 archive to download.
          extra_args=()
          if [ "${{ runner.arch }}" = "ARM64" ]; then
            deps_output="${{ github.workspace }}/src/radarsimcpp/deps/output"
            extra_args+=("--cmake-args=-DRADARSIMCPP_HDF5_ROOT=${deps_output}/hdf5 -DRADARSIMCPP_MBEDTLS_ROOT=${deps_output}/mbedtls")
          fi
          ./build.sh --license=on --arch=${{ matrix.arch }} --test=on --deps=release "${extra_args[@]}"

      - name: Display build logs on failure
        if: failure()
        run: |
          # ctest captures the full C++ test output here. The console copy can be
          # cut short, so this is the reliable record of a crashed test binary.
          if [ -f "src/radarsimcpp/build/Testing/Temporary/LastTest.log" ]; then
            echo "=== C++ Test Log (ctest) ==="
            tail -n 200 "src/radarsimcpp/build/Testing/Temporary/LastTest.log"
          fi
          if [ -f "src/radarsimcpp/build/CMakeFiles/CMakeOutput.log" ]; then
            echo "=== CMake Output Log ==="
            tail -n 100 "src/radarsimcpp/build/CMakeFiles/CMakeOutput.log"
          fi
          if [ -f "src/radarsimcpp/build/CMakeFiles/CMakeError.log" ]; then
            echo "=== CMake Error Log ==="
            tail -n 100 "src/radarsimcpp/build/CMakeFiles/CMakeError.log"
          fi

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # arch is part of the name because the CPU and GPU entries share an
          # Ubuntu version and Python version; upload-artifact rejects duplicates.
          # os_label keeps the x64 and ARM64 entries apart the same way.
          name: build-logs-python-${{ matrix.python-version }}-${{ matrix.os_label }}-${{ matrix.arch }}
          path: build_logs/
          retention-days: 1
          if-no-files-found: warn
