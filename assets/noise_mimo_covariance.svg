<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 311" width="860" height="311"
     role="img" aria-label="Virtual channels sharing an Rx and its timing carry fully correlated noise; staggered Tx timing makes them independent">
  <title>Virtual channels sharing an Rx and its timing carry fully correlated noise; staggered Tx timing makes them independent</title>
