    .lbl   { font:11.5px 'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif; fill:#6b7280 }
    .ax    { font:600 14px 'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif }
    .code  { font:12.5px 'IBM Plex Mono',Consolas,'Courier New',monospace; fill:#0d1117 }
    .mono  { font:11px 'IBM Plex Mono',Consolas,'Courier New',monospace }
    .ink   { fill:#0d1117 }
    .blue  { fill:#1e73be }
    .green { fill:#1a7f37 }
