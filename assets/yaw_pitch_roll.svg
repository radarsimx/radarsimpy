<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="780" height="330"
     role="img" aria-label="Yaw, pitch and roll Euler angles, each coloured by the axis it turns about">
  <title>Yaw, pitch and roll Euler angles, each coloured by the axis it turns about</title>
  <style>
    .bg    { fill:#ffffff; stroke:#d0d7de; stroke-width:1 }
    .panel { fill:#f6f8fa; stroke:#d8dee4; stroke-width:1 }
    .hd    { font:600 13px 'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif; fill:#0d1117 }
    .lbl   { font:11.5px 'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif; fill:#6b7280 }
    .ax    { font:600 14px 'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif }
    .mono  { font:12.5px 'IBM Plex Mono',Consolas,'Courier New',monospace; fill:#0d1117 }
    .ang   { font:600 13px 'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif }
    .aX    { stroke:#cf4640; stroke-width:2.2; fill:none }
    .aY    { stroke:#1a7f37; stroke-width:2.2; fill:none }
    .aZ    { stroke:#1e73be; stroke-width:2.2; fill:none }
  </style>
  <defs>
    <marker id="mX" markerWidth="10" markerHeight="9" refX="8.4" refY="3.6" orient="auto">
      <path d="M0,0 L9,3.6 L0,7.2 z" fill="#cf4640"/></marker>
    <marker id="mY" markerWidth="10" markerHeight="9" refX="8.4" refY="3.6" orient="auto">
      <path d="M0,0 L9,3.6 L0,7.2 z" fill="#1a7f37"/></marker>
    <marker id="mZ" markerWidth="10" markerHeight="9" refX="8.4" refY="3.6" orient="auto">
      <path d="M0,0 L9,3.6 L0,7.2 z" fill="#1e73be"/></marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="779" height="329" rx="8"/>

  <path d="M250,205 L159,263.5 L289,263.5 L380,205 Z"
        fill="#6b7280" fill-opacity="0.06" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 3"/>

  <line class="aZ" x1="250" y1="205" x2="250" y2="75"  marker-end="url(#mZ)"/>
  <line class="aY" x1="250" y1="205" x2="380" y2="205" marker-end="url(#mY)"/>
  <line class="aX" x1="250" y1="205" x2="159" y2="263.5" marker-end="url(#mX)"/>
  <text class="ax" x="250" y="62"  text-anchor="middle" fill="#1e73be">z</text>
  <text class="ax" x="394" y="210" fill="#1a7f37">y</text>
  <text class="ax" x="144" y="278" text-anchor="end" fill="#cf4640">x</text>
  <circle cx="250" cy="205" r="3.4" fill="#0d1117"/>
  <text class="lbl" x="262" y="222">origin</text>

  <!-- yaw: about +z, +x toward +y -->
  <path d="M181.7,248.9 Q283.3,255.2 347.5,205" stroke="#1e73be" stroke-width="2" fill="none"
        marker-end="url(#mZ)"/>
  <text class="ang" x="286" y="281" text-anchor="middle" fill="#1e73be">+yaw</text>

  <!-- pitch: about -y, +x toward +z -->
  <path d="M200,237.2 Q205.4,169.9 250,133.5" stroke="#1a7f37" stroke-width="2" fill="none"
        marker-end="url(#mY)"/>
  <text class="ang" x="188" y="168" text-anchor="end" fill="#1a7f37">+pitch</text>

  <!-- roll: about +x, +y toward +z -->
  <path d="M367,205 Q335.4,119.6 250,88" stroke="#cf4640" stroke-width="2" fill="none"
        marker-end="url(#mX)"/>
  <text class="ang" x="348" y="116" fill="#cf4640">+roll</text>

  <rect class="panel" x="440" y="40" width="316" height="236" rx="6"/>
  <text class="hd"   x="460" y="68">Euler angles</text>
  <text class="lbl"  x="460" y="87">given as <tspan class="mono" style="font-size:11.5px">[yaw, pitch, roll]</tspan>, applied in that order</text>

  <text class="mono" x="460" y="119" fill="#1e73be">yaw</text>
  <text class="lbl"  x="530" y="119">about <tspan fill="#1e73be">+z</tspan> &#160;&#183;&#160; turns +x toward +y</text>
  <text class="mono" x="460" y="140" fill="#1a7f37">pitch</text>
  <text class="lbl"  x="530" y="140">about <tspan fill="#1a7f37">&#8722;y</tspan> &#160;&#183;&#160; turns +x toward +z</text>
  <text class="mono" x="460" y="161" fill="#cf4640">roll</text>
  <text class="lbl"  x="530" y="161">about <tspan fill="#cf4640">+x</tspan> &#160;&#183;&#160; turns +y toward +z</text>

  <text class="mono" x="460" y="196" style="font-size:11.5px">R = Rz(yaw) &#183; Ry(&#8722;pitch) &#183; Rx(roll)</text>

  <text class="lbl"  x="460" y="226">Pitch is the odd one out: it turns opposite</text>
  <text class="lbl"  x="460" y="243">to a right-handed rotation about +y, which is</text>
  <text class="lbl"  x="460" y="260">the aerospace &#8220;nose up is positive&#8221; sense.</text>
</svg>
