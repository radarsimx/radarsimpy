<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="780" height="330"
     role="img" aria-label="Spherical angles phi and theta in the global right-handed frame">
  <title>Spherical angles phi and theta in the global right-handed frame</title>
  <style>
    .bg    { fill:#ffffff; stroke:#d0d7de; stroke-width:1 }
    .panel { fill:#f6f8fa; stroke:#d8dee4; stroke-width:1 }
    .hd    { font:600 13px 'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif; fill:#0d1117 }
    .lbl   { font:11.5px 'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif; fill:#6b7280 }
    .ax    { font:600 14px 'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif }
    .mono  { font:12.5px 'IBM Plex Mono',Consolas,'Courier New',monospace; fill:#0d1117 }
    .ang   { font:600 13px 'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif; fill:#0d1117 }
    .aX    { stroke:#cf4640; stroke-width:2.2; fill:none }
    .aY    { stroke:#1a7f37; stroke-width:2.2; fill:none }
    .aZ    { stroke:#1e73be; stroke-width:2.2; fill:none }
    .arc   { stroke:#0d1117; stroke-width:2; fill:none }
  </style>
  <defs>
    <marker id="mX" markerWidth="10" markerHeight="9" refX="8.4" refY="3.6" orient="auto">
      <path d="M0,0 L9,3.6 L0,7.2 z" fill="#cf4640"/></marker>
    <marker id="mY" markerWidth="10" markerHeight="9" refX="8.4" refY="3.6" orient="auto">
      <path d="M0,0 L9,3.6 L0,7.2 z" fill="#1a7f37"/></marker>
    <marker id="mZ" markerWidth="10" markerHeight="9" refX="8.4" refY="3.6" orient="auto">
      <path d="M0,0 L9,3.6 L0,7.2 z" fill="#1e73be"/></marker>
    <marker id="mA" markerWidth="9" markerHeight="8" refX="7.6" refY="3.2" orient="auto">
      <path d="M0,0 L8,3.2 L0,6.4 z" fill="#0d1117"/></marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="779" height="329" rx="8"/>

  <!-- ground plane, first quadrant -->
  <path d="M250,205 L159,263.5 L289,263.5 L380,205 Z"
        fill="#6b7280" fill-opacity="0.06" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- axes -->
  <line class="aZ" x1="250" y1="205" x2="250" y2="75"  marker-end="url(#mZ)"/>
  <line class="aY" x1="250" y1="205" x2="380" y2="205" marker-end="url(#mY)"/>
  <line class="aX" x1="250" y1="205" x2="159" y2="263.5" marker-end="url(#mX)"/>
  <text class="ax" x="250" y="62"  text-anchor="middle" fill="#1e73be">z</text>
  <text class="ax" x="394" y="210" fill="#1a7f37">y</text>
  <text class="ax" x="144" y="278" text-anchor="end" fill="#cf4640">x</text>
  <circle cx="250" cy="205" r="3.4" fill="#0d1117"/>

  <!-- phi: in the x-y plane, +x toward +y -->
  <path class="arc" d="M181.7,248.9 Q283.3,255.2 347.5,205" marker-end="url(#mA)"/>
  <text class="ang" x="286" y="281" text-anchor="middle">+&#966;</text>

  <!-- theta: from +z down toward the x-y plane -->
  <path class="arc" d="M250,107.5 Q189.2,157.2 181.7,248.9" marker-end="url(#mA)"/>
  <text class="ang" x="176" y="150" text-anchor="end">+&#952;</text>

  <!-- definitions -->
  <rect class="panel" x="440" y="40" width="316" height="236" rx="6"/>
  <text class="hd"   x="460" y="68">Spherical angles</text>

  <text class="mono" x="460" y="98">phi &#966;</text>
  <text class="lbl"  x="460" y="117">azimuthal angle in the x&#8211;y plane</text>
  <text class="lbl"  x="460" y="134">0&#176; at +x, 90&#176; at +y</text>
  <text class="lbl"  x="460" y="151">counter-clockwise viewed from +z</text>
  <text class="lbl"  x="460" y="168">range 0&#176;&#8230;360&#176;, or &#8722;180&#176;&#8230;180&#176;</text>

  <text class="mono" x="460" y="200">theta &#952;</text>
  <text class="lbl"  x="460" y="219">polar angle measured from +z</text>
  <text class="lbl"  x="460" y="236">0&#176; zenith &#183; 90&#176; horizon &#183; 180&#176; nadir</text>
  <text class="lbl"  x="460" y="253">range 0&#176;&#8230;180&#176;</text>
</svg>
