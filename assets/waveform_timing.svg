<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 326" width="860" height="326"
     role="img" aria-label="Chirp train showing f, t, pulse_length and prp">
  <title>Chirp train showing f, t, pulse_length and prp</title>
  <style>
    .bg    { fill:#ffffff; stroke:#d0d7de; stroke-width:1 }
    .lbl   { font:11.5px 'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif; fill:#6b7280 }
    .cap   { font:12px 'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif; fill:#6b7280 }
    .code  { font:12.5px 'IBM Plex Mono',Consolas,'Courier New',monospace }
    .mono  { font:11.5px 'IBM Plex Mono',Consolas,'Courier New',monospace }
    .ray   { fill:#1e73be }
    .env   { fill:#1a7f37 }
    .ink   { fill:#0d1117 }
    .grid  { stroke:#d0d7de; stroke-width:1; stroke-dasharray:4 4 }
    .axis  { stroke:#848d97; stroke-width:1.2 }
    .brk   { stroke:#6b7280; stroke-width:1.1 }
  </style>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="8" refX="7.6" refY="3.2" orient="auto">
      <path d="M0,0 L8,3.2 L0,6.4 z" fill="#848d97"/>
    </marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="859" height="325" rx="8"/>

  <!-- idle band between chirp 1 end and chirp 2 start -->
  <rect x="200" y="66" width="100" height="164" fill="#6b7280" fill-opacity="0.055"/>
  <text class="lbl" x="250" y="150" text-anchor="middle">idle</text>
  <text class="lbl" x="250" y="166" text-anchor="middle">prp &#8722; pulse_length</text>

  <!-- frequency guides -->
  <line class="grid" x1="104" y1="75"  x2="800" y2="75"/>
  <line class="grid" x1="104" y1="215" x2="800" y2="215"/>
  <text class="code ray" x="96" y="79"  text-anchor="end">f[1]</text>
  <text class="code ray" x="96" y="219" text-anchor="end">f[0]</text>

  <!-- axes -->
  <line class="axis" x1="104" y1="240" x2="826" y2="240" marker-end="url(#ar)"/>
  <line class="axis" x1="104" y1="240" x2="104" y2="46"  marker-end="url(#ar)"/>
  <text class="lbl ink" x="112" y="44">frequency</text>
  <text class="lbl ink" x="826" y="258" text-anchor="end">time</text>

  <!-- chirps -->
  <g stroke="#1e73be" stroke-width="2.6" fill="none">
    <path d="M130,215 L200,75"/>
    <path d="M300,215 L370,75"/>
    <path d="M470,215 L540,75"/>
  </g>
  <g stroke="#1e73be" stroke-width="2.6" fill="none" opacity="0.3">
    <path d="M700,215 L770,75"/>
  </g>
  <text class="code ray" x="625" y="152" text-anchor="middle">&#183; &#183; &#183;</text>

  <!-- pulse start ticks -->
  <g fill="#1e73be">
    <path d="M130,241 l-4.5,9 h9 z"/>
    <path d="M300,241 l-4.5,9 h9 z"/>
    <path d="M470,241 l-4.5,9 h9 z"/>
  </g>
  <text class="mono ray" x="130" y="272" text-anchor="middle">[0]</text>
  <text class="mono ray" x="300" y="272" text-anchor="middle">[1]</text>
  <text class="mono ray" x="470" y="272" text-anchor="middle">[2]</text>
  <text class="mono ray" x="560" y="272">pulse_start_time = cumsum(prp) &#8722; prp[0]</text>

  <!-- prp bracket (above) -->
  <g class="brk" fill="none">
    <path d="M130,62 L130,52 L300,52 L300,62"/>
  </g>
  <rect x="188" y="42" width="54" height="18" fill="#ffffff"/>
  <text class="code ink" x="215" y="56" text-anchor="middle">prp[0]</text>

  <!-- pulse_length bracket (below, under first chirp) -->
  <g class="brk" fill="none">
    <path d="M130,296 L130,306 L200,306 L200,296"/>
  </g>
  <text class="code ink" x="165" y="322" text-anchor="middle">pulse_length</text>

  <!-- t ticks -->
  <line class="grid" x1="130" y1="215" x2="130" y2="292"/>
  <line class="grid" x1="200" y1="75"  x2="200" y2="292"/>
  <rect x="112" y="280" width="36" height="17" fill="#ffffff"/>
  <rect x="180" y="280" width="42" height="17" fill="#ffffff"/>
  <text class="code ray" x="130" y="293" text-anchor="middle">t[0]</text>
  <text class="code ray" x="201" y="293" text-anchor="middle">t[-1]</text>
</svg>
