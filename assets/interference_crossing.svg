<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400"
     role="img" aria-label="An interfering chirp only reaches the baseband where it crosses the victim receiver's passband">
  <title>An interfering chirp only reaches the baseband where it crosses the victim receiver's passband</title>
  <style>
    .bg    { fill:#ffffff; stroke:#d0d7de; stroke-width:1 }
    .lbl   { font:11.5px 'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif; fill:#6b7280 }
    .rowlb { font:600 12px 'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif }
    .mono  { font:11px 'IBM Plex Mono',Consolas,'Courier New',monospace }
    .code  { font:12.5px 'IBM Plex Mono',Consolas,'Courier New',monospace }
    .vic   { fill:#1e73be }
    .itf   { fill:#cf4640 }
    .ink   { fill:#0d1117 }
    .axis  { stroke:#848d97; stroke-width:1.2 }
    .guide { stroke:#0d1117; stroke-width:1; stroke-dasharray:4 3; opacity:0.45 }
  </style>
  <defs>
    <marker id="iAx" markerWidth="9" markerHeight="8" refX="7.6" refY="3.2" orient="auto">
      <path d="M0,0 L8,3.2 L0,6.4 z" fill="#848d97"/></marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="859" height="399" rx="8"/>

  <!-- ===== frequency vs time ===== -->
  <line class="axis" x1="110" y1="240" x2="826" y2="240" marker-end="url(#iAx)"/>
  <line class="axis" x1="110" y1="240" x2="110" y2="48"  marker-end="url(#iAx)"/>
  <text class="lbl ink" x="118" y="46">frequency</text>
  <text class="lbl ink" x="826" y="258" text-anchor="end">time within one sweep</text>

  <!-- receiver passband around the victim's own chirp -->
  <polygon points="110,206 800,66 800,94 110,234" fill="#1e73be" fill-opacity="0.12"/>
  <text class="mono vic" x="470" y="176">&#177; fs</text>

  <!-- victim chirp = the LO reference -->
  <line x1="110" y1="220" x2="800" y2="80" stroke="#1e73be" stroke-width="2.6"/>
  <text class="rowlb vic" x="806" y="60" text-anchor="end">victim chirp &#8212; the deramp reference</text>

  <!-- interfering chirps, steeper and repeating -->
  <g stroke="#cf4640" stroke-width="2.4" fill="none">
    <line x1="150" y1="231.7" x2="410" y2="80"/>
    <line x1="430" y1="220" x2="670" y2="80"/>
    <line x1="690" y1="220" x2="810" y2="150"/>
  </g>
  <text class="rowlb itf" x="330" y="70">interferer</text>
  <text class="lbl itf"   x="330" y="86">a different slope and period</text>

  <!-- time spent inside the passband -->
  <rect x="165.4" y="52" width="73.6" height="302" fill="#cf4640" fill-opacity="0.06"/>
  <rect x="563.9" y="52" width="73.6" height="302" fill="#cf4640" fill-opacity="0.06"/>
  <g stroke="#cf4640" stroke-width="6" stroke-linecap="round" opacity="0.35">
    <line x1="165.4" y1="222.7" x2="239.0" y2="179.7"/>
    <line x1="563.9" y1="141.9" x2="637.5" y2="99.0"/>
  </g>

  <!-- crossings -->
  <circle cx="202" cy="201" r="6" fill="#ffffff" stroke="#cf4640" stroke-width="2.4"/>
  <circle cx="601" cy="120" r="6" fill="#ffffff" stroke="#cf4640" stroke-width="2.4"/>
  <line class="guide" x1="202" y1="207" x2="202" y2="302"/>
  <line class="guide" x1="601" y1="126" x2="601" y2="302"/>
  <text class="code ink" x="212" y="230">|f_lo &#8722; f_interf| &lt; fs</text>

  <!-- ===== resulting baseband (real part) ===== -->
  <text class="rowlb ink" x="100" y="322" text-anchor="end">baseband</text>
  <text class="lbl" x="100" y="337" text-anchor="end">real part</text>
  <line class="axis" x1="110" y1="326" x2="826" y2="326"/>
  <g stroke="#cf4640" stroke-width="1" stroke-dasharray="3 3" opacity="0.6">
    <line x1="165.4" y1="305" x2="239.0" y2="305"/><line x1="165.4" y1="347" x2="239.0" y2="347"/>
    <line x1="563.9" y1="305" x2="637.5" y2="305"/><line x1="563.9" y1="347" x2="637.5" y2="347"/>
  </g>
