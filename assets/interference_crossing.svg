    <path d="M563.9,326.0 L563.9,345.3 L564.4,346.6 L564.9,340.7 L565.4,329.9 L565.9,318.0 L566.4,308.8 L566.9,305.0 L567.4,307.7 L567.9,315.7 L568.4,326.5 L568.9,337.1 L569.4,344.5 L569.9,347.0 L570.4,344.2 L570.9,337.0 L571.4,327.3 L571.9,317.4 L572.4,309.7 L572.9,305.5 L573.4,305.6 L573.9,309.8 L574.4,317.0 L574.9,325.7 L575.4,334.4 L575.9,341.4 L576.4,345.8 L576.9,347.0 L577.4,344.9 L577.9,340.2 L578.4,333.6 L578.9,326.1 L579.4,318.8 L579.9,312.5 L580.4,307.9 L580.9,305.4 L581.4,305.2 L581.9,307.0 L582.4,310.5 L582.9,315.4 L583.4,321.0 L583.9,326.9 L584.4,332.6 L584.9,337.6 L585.4,341.6 L585.9,344.6 L586.4,346.4 L586.9,347.0 L587.4,346.5 L587.9,345.1 L588.4,342.9 L588.9,340.0 L589.4,336.8 L589.9,333.4 L590.4,329.9 L590.9,326.4 L591.4,323.1 L591.9,320.0 L592.4,317.2 L592.9,314.8 L593.4,312.7 L593.9,310.9 L594.4,309.4 L594.9,308.2 L595.4,307.2 L595.9,306.5 L596.4,306.0 L596.9,305.6 L597.4,305.3 L597.9,305.2 L598.4,305.1 L598.9,305.0 L599.4,305.0 L599.9,305.0 L600.4,305.0 L600.9,305.0 L601.4,305.0 L601.9,305.0 L602.4,305.0 L602.9,305.1 L603.4,305.2 L603.9,305.3 L604.4,305.5 L604.9,305.9 L605.4,306.4 L605.9,307.1 L606.4,308.0 L606.9,309.1 L607.4,310.5 L607.9,312.2 L608.4,314.3 L608.9,316.7 L609.4,319.4 L609.9,322.4 L610.4,325.7 L610.9,329.1 L611.4,332.6 L611.9,336.1 L612.4,339.4 L612.9,342.3 L613.4,344.7 L613.9,346.3 L614.4,347.0 L614.9,346.6 L615.4,345.1 L615.9,342.4 L616.4,338.5 L616.9,333.7 L617.4,328.2 L617.9,322.3 L618.4,316.6 L618.9,311.5 L619.4,307.6 L619.9,305.4 L620.4,305.2 L620.9,307.2 L621.4,311.4 L621.9,317.3 L622.4,324.5 L622.9,332.1 L623.4,338.9 L623.9,344.1 L624.4,346.8 L624.9,346.3 L625.4,342.6 L625.9,336.0 L626.4,327.6 L626.9,318.8 L627.4,311.1 L627.9,306.2 L628.4,305.1 L628.9,308.4 L629.4,315.5 L629.9,325.1 L630.4,335.0 L630.9,343.0 L631.4,346.8 L631.9,345.5 L632.4,339.0 L632.9,328.9 L633.4,317.9 L633.9,309.0 L634.4,305.1 L634.9,307.4 L635.4,315.7 L635.9,327.3 L636.4,338.7 L636.9,345.9 L637.4,346.2 L637.4,326.0"/>
  </g>
  <text class="lbl itf" x="647.5" y="310">constant amplitude</text>
  <text class="lbl itf" x="647.5" y="325">beat sweeps through zero</text>
  <text class="lbl itf" x="647.5" y="340">at the crossing</text>
  <text class="lbl" x="110" y="382">Everywhere else the interferer is outside the passband and contributes nothing at all.</text>
</svg>
