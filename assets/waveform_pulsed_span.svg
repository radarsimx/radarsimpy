<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 262" width="860" height="262"
     role="img" aria-label="How far mod_t spans decides whether a target beyond the unambiguous range folds back or vanishes">
  <title>How far mod_t spans decides whether a target beyond the unambiguous range folds back or vanishes</title>
  <style>
    .bg    { fill:#ffffff; stroke:#d0d7de; stroke-width:1 }
    .lbl   { font:11.5px 'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif; fill:#6b7280 }
    .mono  { font:11px 'IBM Plex Mono',Consolas,'Courier New',monospace }
    .rowlb { font:600 11.5px 'IBM Plex Mono',Consolas,'Courier New',monospace; fill:#0d1117 }
    .tx    { fill:#1e73be }
    .ec    { fill:#cf4640 }
    .axis  { stroke:#848d97; stroke-width:1.1 }
  </style>
  <defs>
    <marker id="sEc" markerWidth="9" markerHeight="8" refX="7.6" refY="3.2" orient="auto">
      <path d="M0,0 L8,3.2 L0,6.4 z" fill="#cf4640"/></marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="859" height="261" rx="8"/>

  <!-- echo guide -->
  <text class="lbl ec" x="420" y="26" text-anchor="middle">echo from pulse 0, round trip longer than one PRI</text>
  <line x1="420" y1="32" x2="420" y2="206" stroke="#cf4640" stroke-width="1.3" stroke-dasharray="5 3"/>
  <circle cx="420" cy="86" r="4" fill="#cf4640"/>
  <circle cx="420" cy="176" r="4" fill="#cf4640"/>

  <!-- ================= lane A : mod_t spans one PRI ================= -->
  <text class="rowlb" x="100" y="70" text-anchor="end">mod_t = 1 PRI</text>
  <line class="axis" x1="110" y1="86" x2="806" y2="86"/>
  <g fill="#1e73be" fill-opacity="0.75" stroke="none">
    <rect x="110" y="62" width="8" height="24"/>
    <rect x="340" y="62" width="8" height="24"/>
    <rect x="570" y="62" width="8" height="24"/>
  </g>
  <rect x="110" y="92" width="230" height="13" rx="2"
        fill="#1e73be" fill-opacity="0.16" stroke="#1e73be" stroke-width="1.5"/>
  <g fill="#1e73be" fill-opacity="0.06" stroke="#1e73be" stroke-width="1.2" stroke-dasharray="4 3">
    <rect x="340" y="92" width="230" height="13" rx="2"/>
    <rect x="570" y="92" width="230" height="13" rx="2"/>
  </g>
  <text class="mono tx" x="225" y="102" text-anchor="middle">table</text>
  <text class="mono tx" x="455" y="102" text-anchor="middle">repeats</text>
  <text class="mono tx" x="685" y="102" text-anchor="middle">repeats</text>
  <text class="lbl" x="110" y="124">The table wraps every period, so the late echo lands on the gate again and <tspan class="ec">folds back</tspan> into the window.</text>

  <!-- ================= lane B : mod_t spans the frame ================= -->
  <text class="rowlb" x="100" y="160" text-anchor="end">mod_t = frame</text>
  <line class="axis" x1="110" y1="176" x2="806" y2="176"/>
  <g fill="#1e73be" fill-opacity="0.75" stroke="none">
    <rect x="110" y="152" width="8" height="24"/>
    <rect x="340" y="152" width="8" height="24"/>
    <rect x="570" y="152" width="8" height="24"/>
  </g>
  <rect x="110" y="182" width="690" height="13" rx="2"
        fill="#1e73be" fill-opacity="0.16" stroke="#1e73be" stroke-width="1.5"/>
  <text class="mono tx" x="455" y="192" text-anchor="middle">one table across every pulse &#8212; no wrap</text>
  <text class="lbl" x="110" y="214">The echo reads a part of the table where <tspan class="mono tx">amp</tspan> is zero, so it <tspan class="ec">produces no return</tspan> at all.</text>

  <!-- caution -->
  <line x1="110" y1="228" x2="800" y2="228" stroke="#d0d7de" stroke-width="1"/>
  <text class="lbl" x="110" y="248">A round trip longer than the span of <tspan class="mono tx">mod_t</tspan> also indexes before the start of the table, adding a <tspan class="ec">spurious return</tspan> whose level is undefined.</text>
</svg>
