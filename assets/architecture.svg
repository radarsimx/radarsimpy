<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400"
     role="img" aria-label="Coherent radar transceiver: the receiver deramps against a tap of the transmit oscillator">
  <title>Coherent radar transceiver: the receiver deramps against a tap of the transmit oscillator</title>
  <style>
    .bg    { fill:#ffffff; stroke:#d0d7de; stroke-width:1 }
    .panT  { fill:#1e73be; fill-opacity:0.05; stroke:#1e73be; stroke-width:1.6; stroke-dasharray:6 4 }
    .panR  { fill:#1a7f37; fill-opacity:0.05; stroke:#1a7f37; stroke-width:1.6; stroke-dasharray:6 4 }
    .hdT   { font:600 13px 'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif; fill:#1e73be }
    .hdR   { font:600 13px 'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif; fill:#1a7f37 }
    .lbl   { font:11.5px 'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif; fill:#6b7280 }
    .mono  { font:11px 'IBM Plex Mono',Consolas,'Courier New',monospace }
    .code  { font:12.5px 'IBM Plex Mono',Consolas,'Courier New',monospace }
    .tx    { fill:#1e73be }
    .rx    { fill:#1a7f37 }
    .wT    { stroke:#1e73be; stroke-width:1.7; fill:none }
    .wR    { stroke:#1a7f37; stroke-width:1.7; fill:none }
    .symT  { stroke:#1e73be; stroke-width:1.9; fill:none }
    .symR  { stroke:#1a7f37; stroke-width:1.9; fill:none }
  </style>
  <defs>
    <marker id="aT" markerWidth="10" markerHeight="9" refX="8.4" refY="3.6" orient="auto">
      <path d="M0,0 L9,3.6 L0,7.2 z" fill="#1e73be"/>
    </marker>
    <marker id="aR" markerWidth="10" markerHeight="9" refX="8.4" refY="3.6" orient="auto">
      <path d="M0,0 L9,3.6 L0,7.2 z" fill="#1a7f37"/>
    </marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="859" height="399" rx="8"/>

  <!-- ==================== TRANSMITTER ==================== -->
  <rect class="panT" x="286" y="36" width="548" height="112" rx="6"/>
  <text class="hdT" x="300" y="58">Transmitter</text>

  <!-- oscillator -->
  <circle class="symT" cx="350" cy="104" r="17"/>
  <path class="symT" d="M339,104 c3,-8 8,-8 11,0 c3,8 8,8 11,0" stroke-width="1.6"/>

  <!-- osc -> modulator, with the LO tap -->
  <line class="wT" x1="367" y1="104" x2="545" y2="104"/>
  <circle class="tx" cx="470" cy="104" r="3.6"/>

  <!-- modulator -->
  <circle class="symT" cx="560" cy="104" r="15"/>
  <path class="symT" d="M549.4,93.4 L570.6,114.6 M549.4,114.6 L570.6,93.4" stroke-width="1.6"/>

  <!-- power amplifier -->
  <line class="wT" x1="575" y1="104" x2="634" y2="104"/>
  <path class="symT" d="M634,88 L634,120 L668,104 Z"/>

  <!-- transmit antenna -->
  <line class="wT" x1="668" y1="104" x2="750" y2="104"/>
  <path class="symT" d="M750,104 L750,80"/>
  <path class="symT" d="M736,64 L764,64 L750,80 Z"/>

  <g class="lbl" text-anchor="middle">
    <text x="350" y="136">oscillator</text>
    <text x="560" y="136">modulator</text>
    <text x="651" y="136">PA</text>
    <text x="750" y="136">antenna</text>
  </g>

  <!-- ==================== SHARED LO ==================== -->
  <line class="wT" x1="470" y1="104" x2="470" y2="266" marker-end="url(#aT)"/>
  <text class="code tx" x="482" y="180">shared LO</text>

  <!-- ==================== RECEIVER ==================== -->
  <rect class="panR" x="26" y="192" width="808" height="192" rx="6"/>
  <text class="hdR" x="40" y="214">Receiver</text>

  <!-- receive antenna -->
  <path class="symR" d="M790,286 L790,258"/>
  <path class="symR" d="M776,242 L804,242 L790,258 Z"/>
  <line class="wR" x1="790" y1="286" x2="720" y2="286"/>

  <!-- low-noise amplifier (signal flows right to left) -->
  <path class="symR" d="M720,270 L720,302 L686,286 Z"/>
  <line class="wR" x1="686" y1="286" x2="487" y2="286"/>

  <!-- mixer -->
  <circle class="symR" cx="470" cy="286" r="17"/>
  <path class="symR" d="M458,274 L482,298 M458,298 L482,274" stroke-width="1.6"/>

  <!-- split into I and Q -->
  <line class="wR" x1="453" y1="286" x2="430" y2="286"/>
  <line class="wR" x1="430" y1="248" x2="430" y2="324"/>

  <!-- I branch -->
  <line class="wR" x1="430" y1="248" x2="370" y2="248"/>
  <circle class="rx" cx="400" cy="248" r="3.2"/>
  <path class="symR" d="M400,248 V242 l-6,-2 l12,-4.5 l-12,-4.5 l12,-4.5 l-6,-2 V220" stroke-width="1.6"/>
  <g class="symR" stroke-width="1.6">
    <line x1="390" y1="220" x2="410" y2="220"/>
    <line x1="393.5" y1="216" x2="406.5" y2="216"/>
    <line x1="397" y1="212" x2="403" y2="212"/>
  </g>
  <path class="symR" d="M370,232 L370,264 L336,248 Z"/>
  <line class="wR" x1="336" y1="248" x2="306" y2="248"/>
  <rect class="symR" x="256" y="224" width="50" height="48" rx="3"/>
  <g class="symR" stroke-width="1.5">
    <path d="M266,235 c5,-7 10,7 15,0 c5,-7 10,7 15,0"/>
    <path d="M266,248 c5,-7 10,7 15,0 c5,-7 10,7 15,0"/>
    <path d="M266,261 c5,-7 10,7 15,0 c5,-7 10,7 15,0"/>
  </g>
  <line class="wR" x1="256" y1="248" x2="226" y2="248"/>
  <path class="symR" d="M226,248 L208,223 L166,223 L166,273 L208,273 Z"/>
  <g class="wR" marker-end="url(#aR)">
    <line x1="166" y1="233" x2="110" y2="233"/>
    <line x1="166" y1="248" x2="110" y2="248"/>
    <line x1="166" y1="263" x2="110" y2="263"/>
  </g>
  <text class="code rx" x="100" y="252" text-anchor="end">I</text>

  <!-- Q branch -->
  <line class="wR" x1="430" y1="324" x2="370" y2="324"/>
  <circle class="rx" cx="400" cy="324" r="3.2"/>
  <path class="symR" d="M400,324 V330 l-6,2 l12,4.5 l-12,4.5 l12,4.5 l-6,2 V352" stroke-width="1.6"/>
  <g class="symR" stroke-width="1.6">
    <line x1="390" y1="352" x2="410" y2="352"/>
    <line x1="393.5" y1="356" x2="406.5" y2="356"/>
    <line x1="397" y1="360" x2="403" y2="360"/>
  </g>
  <path class="symR" d="M370,308 L370,340 L336,324 Z"/>
  <line class="wR" x1="336" y1="324" x2="306" y2="324"/>
  <rect class="symR" x="256" y="300" width="50" height="48" rx="3"/>
  <g class="symR" stroke-width="1.5">
    <path d="M266,311 c5,-7 10,7 15,0 c5,-7 10,7 15,0"/>
    <path d="M266,324 c5,-7 10,7 15,0 c5,-7 10,7 15,0"/>
    <path d="M266,337 c5,-7 10,7 15,0 c5,-7 10,7 15,0"/>
  </g>
  <line class="wR" x1="256" y1="324" x2="226" y2="324"/>
  <path class="symR" d="M226,324 L208,299 L166,299 L166,349 L208,349 Z"/>
  <g class="wR" marker-end="url(#aR)">
    <line x1="166" y1="309" x2="110" y2="309"/>
    <line x1="166" y1="324" x2="110" y2="324"/>
    <line x1="166" y1="339" x2="110" y2="339"/>
  </g>
  <text class="code rx" x="100" y="328" text-anchor="end">Q</text>

  <!-- receiver labels -->
  <g class="lbl" text-anchor="middle">
    <text x="196" y="212">ADC</text>
    <text x="281" y="212">LPF</text>
    <text x="342" y="212">baseband amp</text>
    <text x="470" y="318">mixer</text>
    <text x="703" y="262">LNA</text>
    <text x="790" y="314">antenna</text>
  </g>
  <text class="mono rx" x="418" y="228">load_resistor</text>
</svg>
