[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Fail on unknown markers so typos in ``@pytest.mark.*`` are caught immediately.
addopts =
    --strict-markers
    --strict-config
    -ra

markers =
    mesh: requires an optional mesh-processing library (trimesh/pyvista/pymeshlab/meshio)
    slow: long-running simulation, deselect with '-m "not slow"'

filterwarnings =
    default
    # ``os_cfar_threshold`` legitimately probes extreme values while converging.
    ignore:overflow encountered:RuntimeWarning
    ignore:divide by zero encountered:RuntimeWarning
    ignore:invalid value encountered:RuntimeWarning
